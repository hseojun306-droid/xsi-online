<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>크시 (Xsi) AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <aside>
    <img class="avatar" src="ksi_avatar.jpg" alt="크시(Xsi) 캐릭터">
    <h1>크시 (Xsi)</h1>
    <p>당신의 친절한 AI 친구 💙</p>
    <nav>
      <button class="active">💬 새 대화</button>
      <button onclick="showMemory()">🧠 기억 보기</button>
      <button onclick="send('/도움말')">❓ 도움말</button>
      <button onclick="resetMemory()">⚙️ 기억 초기화</button>
      <button onclick="openScriptEditor()">🧩 내 스크립트</button>
    </nav>
    <div class="commands">
      <b>크시의 명령어</b>
      <p>/도움말　도움말 보기</p>
      <p>/기억　기억 보기</p>
      <p>/기억해 내용　내용 저장</p>
      <p>/이름 이름　이름 기억</p>
      <p>/좋아해 내용　좋아하는 것 저장</p>
      <p>/시간　현재 시간</p>
      <p>/농담　농담</p>
    </div>
  </aside>

  <section class="main">
    <header>
      <div>
        <h2>크시 (Xsi) 와의 대화</h2>
        <span>🟢 온라인</span>
      </div>
      <button onclick="clearChat()">🗑️</button>
    </header>

    <div id="chat" class="chat"></div>

    <!-- 온라인 모드가 사용하는 form -->
    <form id="form" class="input">
      <input id="input" placeholder="크시에게 메시지를 입력하세요..." autocomplete="off">
      <button type="submit">➤ 전송</button>
    </form>
  </section>
</main>

<div id="scriptPanel" class="script-panel hidden">
  <div class="script-box">
    <div class="script-head">
      <div>
        <h2>🧩 크시 스크립트 편집기</h2>
        <p>내가 원하는 명령어를 직접 만들어 보세요.</p>
      </div>
      <button onclick="closeScriptEditor()">✕</button>
    </div>
    <textarea id="scriptInput" spellcheck="false" placeholder="예시:
/춤 => 크시가 신나게 춤을 춰요! 💜
/칭찬 => 고마워요! 크시가 기분이 좋아졌어요 😸
/인사 => 안녕하세요, {이름}님! 🐱

형식: /명령어 => 크시의 대답
여러 줄을 입력할 수 있어요."></textarea>
    <div class="script-help">💡 <b>사용법</b>: 한 줄에 하나씩 <code>/명령어 =&gt; 대답</code> 형식으로 작성하세요. <code>{이름}</code>은 기억된 이름으로 바뀝니다.</div>
    <div class="script-actions">
      <button onclick="loadExampleScript()">예시 넣기</button>
      <button onclick="clearScriptEditor()">비우기</button>
      <button class="save-script" onclick="saveScripts()">💾 스크립트 저장</button>
    </div>
    <div id="scriptStatus"></div>
  </div>
</div>

<script src="script.js"></script>
<div class="online-note">🌐 <b>Xsi 온라인 모드</b> · 친구들과 같은 방에서 대화할 수 있어요.</div>
</body>
</html>
